[package]
name = "sigilbuzz-pdf"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PDF font emitters (Type 1, Type 3, OTF/TrueType-embedded) for sigilbuzz glyph outlines."
publish = true
readme = "README.md"
keywords = ["pdf", "font-embedding", "type3", "type1", "opentype"]
categories = ["rendering", "text-processing"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# No extra deps. Fixtures are loaded with include_bytes!.

[lints]
workspace = true
