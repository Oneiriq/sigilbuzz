[package]
name = "sigilbuzz-subset"
version = "0.13.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Font subsetter and variable-font instancer for sigilbuzz. Produces a smaller font containing only the glyphs you keep."
publish = true
readme = "README.md"
keywords = ["font", "subset", "opentype", "truetype", "sigilbuzz"]
categories = ["text-processing", "compression"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# Fixtures load via include_bytes!.
# rustybuzz is the reference the instancing and subsetting parity tests
# shape against: it applies GPOS anchor and ValueRecord variations, so
# a baked or subset font can be checked against the variable source.
# Dev-dep only, and already pinned by the root crate's parity tests.
rustybuzz = "0.20"

[lints]
workspace = true
