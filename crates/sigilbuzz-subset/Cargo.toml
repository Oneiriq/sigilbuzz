[package]
name = "sigilbuzz-subset"
version = "0.11.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Font subsetter and variable-font instancer for sigilbuzz. Produces a smaller font containing only the glyphs you keep."
publish = true
readme = "README.md"
keywords = ["font", "subset", "opentype", "truetype", "sigilbuzz"]
categories = ["text-processing", "compression"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# Fixtures load via include_bytes!.

[lints]
workspace = true
