[package]
name = "sigilbuzz-subset"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Font subsetter for sigilbuzz — produces a smaller font containing only a chosen glyph set."
publish = true
readme = "README.md"
keywords = ["font", "subset", "opentype", "truetype", "sigilbuzz"]
categories = ["text-processing", "compression"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# Fixtures load via include_bytes!.
