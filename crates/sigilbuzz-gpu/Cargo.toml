[package]
name = "sigilbuzz-gpu"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU outline encoder for sigilbuzz, packing glyph outlines into Slug-algorithm band/segment buffers for fragment-shader coverage."
publish = true
readme = "README.md"
keywords = ["gpu", "slug", "text-rendering", "opentype", "sigilbuzz"]
categories = ["rendering::graphics-api", "text-processing"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# No extra runtime fixtures. Fonts are loaded with include_bytes!.
# Criterion drives the encode bench. Dev-dep only.
criterion = "0.8"

[[bench]]
name = "encode"
harness = false

[lints]
workspace = true
