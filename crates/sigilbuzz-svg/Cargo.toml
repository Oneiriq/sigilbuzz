[package]
name = "sigilbuzz-svg"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SVG serialiser for sigilbuzz glyph outlines and COLRv1 color glyphs, producing self-contained <svg> documents."
publish = true
readme = "README.md"
keywords = ["svg", "vector", "opentype", "color-fonts", "sigilbuzz"]
categories = ["rendering", "text-processing"]

[features]
default = ["std", "color"]
std = []
# `color` enables COLRv1 emission; without it sigilbuzz-svg does
# outline-only output and avoids the sigilbuzz-paint dep.
color = ["dep:sigilbuzz-paint"]

[dependencies]
sigilbuzz = { workspace = true }
sigilbuzz-paint = { path = "../sigilbuzz-paint", version = "0.1.0", optional = true }

[dev-dependencies]

[lints]
workspace = true
