[package]
name = "sigilbuzz-paint"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "COLRv1 paint evaluator for sigilbuzz: walks the paint tree and emits a flat DrawCmd stream for renderers."
publish = true
readme = "README.md"
keywords = ["colr", "paint", "color-fonts", "opentype", "sigilbuzz"]
categories = ["rendering", "text-processing"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }

[dev-dependencies]
# Criterion drives the COLRv1 evaluator bench. Dev-dep only.
criterion = "0.8"
# ttf-parser paints variable COLRv1 glyphs itself; the parity test
# checks our variation deltas against it. Dev-dep only.
ttf-parser = "0.25"

[[bench]]
name = "evaluate"
harness = false

[lints]
workspace = true
