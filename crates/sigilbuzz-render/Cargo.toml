[package]
name = "sigilbuzz-render"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Software CPU rasterizer for sigilbuzz — outlines, COLRv0 layered glyphs, variable-font coord-aware."
publish = true
readme = "README.md"
keywords = ["sigilbuzz", "rasterizer", "fonts", "color"]
categories = ["graphics", "rendering"]

[features]
default = ["std"]
std = []

[dependencies]
sigilbuzz = { workspace = true }
sigilbuzz-paint = { path = "../sigilbuzz-paint", version = "0.1.0" }
# `miniz_oxide` provides the zlib INFLATE primitive used by the
# embedded PNG decoder for CBDT / sbix bitmap tables. Same dep
# already pulled in by `sigilbuzz-woff` for WOFF1 zlib (see
# docs/deps.md). `with-alloc` is the only feature we need; default
# features stay off so we don't drag in std-only paths.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
# Fixtures via include_bytes!.
