[package]
name = "sigilbuzz-capi"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HarfBuzz-symbol-compatible C API for sigilbuzz. Drop-in -lharfbuzz replacement."
publish = true
readme = "README.md"
keywords = ["harfbuzz", "ffi", "shaping", "sigilbuzz"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
# Build all three: a cdylib for `-lsigilbuzz` linkers, a staticlib for
# CMake / Bazel projects that prefer to absorb the symbols, and an
# rlib so downstream Rust consumers can pull the C wrappers in for
# testing without going through dlopen.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# `std` is on by default — the same posture as the core shaper. The
# C surface itself does not need std (everything routes through
# `extern crate alloc`), but `hb_blob_create_from_file` reads from
# disk and requires `std::fs`.
#
# `subset` pulls in sigilbuzz-subset and unlocks the `hb_subset_*`
# bridge; `paint` pulls in sigilbuzz-paint and unlocks the
# `hb_paint_*` bridge. Both are on by default so a stock
# `cargo build -p sigilbuzz-capi` produces the full
# HarfBuzz-symbol-compatible surface; downstream consumers that
# want a leaner cdylib can disable them with
# `--no-default-features --features std`.
default = ["std", "subset", "paint"]
std = []
subset = ["dep:sigilbuzz-subset"]
paint = ["dep:sigilbuzz-paint"]

[dependencies]
# The shaping core. No other deps — the whole point of the crate is
# to be a thin extern-C veneer over sigilbuzz, so adding anything
# else would defeat the value proposition.
sigilbuzz = { workspace = true }
# Optional — enabled by the `subset` cargo feature. Provides the
# subsetter sigilbuzz-capi's `hb_subset_*` shim wraps.
sigilbuzz-subset = { path = "../sigilbuzz-subset", version = "0.5.0", optional = true }
# Optional — enabled by the `paint` cargo feature. Provides the
# COLRv1 evaluator sigilbuzz-capi's `hb_paint_*` shim wraps.
sigilbuzz-paint = { path = "../sigilbuzz-paint", version = "0.1.0", optional = true }

[dev-dependencies]
# `cc` builds the C source files in `tests/c/` against the cdylib
# during `cargo test`. Dev-dep only; never enters the runtime
# closure of any release artifact.
cc = "1.0"
