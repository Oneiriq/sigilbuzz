[package]
name = "sigilbuzz-capi"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HarfBuzz-symbol-compatible C API for sigilbuzz. Drop-in -lharfbuzz replacement."
publish = true
readme = "README.md"
keywords = ["harfbuzz", "ffi", "shaping", "sigilbuzz"]
categories = ["text-processing", "external-ffi-bindings"]

[lib]
# Build all three: a cdylib for C programs that link dynamically, a
# staticlib for projects that prefer to absorb the symbols, and an
# rlib so Rust tests can call the C wrappers without going through
# dlopen.
crate-type = ["cdylib", "staticlib", "rlib"]

# Install settings for `cargo cinstall` (https://github.com/lu-zero/cargo-c).
# It installs the C library as `libsigilbuzz`, the header as
# `sigilbuzz/hb.h`, a matching `sigilbuzz.pc`, and the CMake package
# config. Plain `cargo build` names the output `sigilbuzz_capi` instead,
# because the Rust library name `sigilbuzz` belongs to the core crate.
[package.metadata.capi]
min_version = "0.10.0"

[package.metadata.capi.library]
name = "sigilbuzz"

[package.metadata.capi.header]
name = "hb"
subdirectory = "sigilbuzz"
# The header is written by hand (`include/hb.h`), not generated.
generation = false

[package.metadata.capi.pkg_config]
name = "sigilbuzz"
filename = "sigilbuzz"
description = "HarfBuzz-compatible text shaping library"

[package.metadata.capi.install.include]
# Installs as `<prefix>/include/sigilbuzz/hb.h`.
asset = [{ from = "include/hb.h", to = "sigilbuzz" }]

[package.metadata.capi.install.data]
# Installs as `<prefix>/share/cmake/Sigilbuzz/SigilbuzzConfig.cmake`,
# one of the places `find_package` looks.
asset = [{ from = "cmake/SigilbuzzConfig.cmake", to = "cmake/Sigilbuzz" }]

[features]
# `std` is on by default, the same as the core shaper. The
# C surface itself does not need std (everything routes through
# `extern crate alloc`), but `hb_blob_create_from_file` reads from
# disk and requires `std::fs`.
#
# `subset` pulls in sigilbuzz-subset and unlocks the `hb_subset_*`
# bridge. `paint` pulls in sigilbuzz-paint and unlocks the
# `hb_paint_*` bridge. Both are on by default so a stock
# `cargo build -p sigilbuzz-capi` produces the full
# HarfBuzz-symbol-compatible surface. Consumers that want a
# leaner cdylib can disable them with
# `--no-default-features --features std`.
default = ["std", "subset", "paint"]
std = []
subset = ["dep:sigilbuzz-subset"]
paint = ["dep:sigilbuzz-paint"]
# cargo-c turns this on for every `cargo cbuild` / `cargo cinstall`. It
# gates nothing, but the feature has to exist.
capi = []

[dependencies]
# The shaping core. No other required deps. This crate is a thin
# extern-C layer over sigilbuzz, and it should stay that way.
sigilbuzz = { workspace = true }
# Optional, enabled by the `subset` cargo feature. Provides the
# subsetter sigilbuzz-capi's `hb_subset_*` shim wraps.
sigilbuzz-subset = { path = "../sigilbuzz-subset", version = "0.11.0", optional = true }
# Optional, enabled by the `paint` cargo feature. Provides the
# COLRv1 evaluator sigilbuzz-capi's `hb_paint_*` shim wraps.
sigilbuzz-paint = { path = "../sigilbuzz-paint", version = "0.1.0", optional = true }

[dev-dependencies]
# `cc` builds the C source files in `tests/c/` against the cdylib
# during `cargo test`. Dev-dep only. It never enters the runtime
# closure of any release artifact.
cc = "1.0"
# `fd-lock` provides the OS-level advisory file lock used by the
# C-link tests in `tests/c_link.rs` to serialize the workspace-wide
# cdylib rebuild step. A process-local `Mutex<()>` is not enough
# under `cargo test --workspace`, where capi tests run alongside
# other workspace crates that may also touch the cdylib's target
# dir. The file lock works across processes. Dev-dep only. The
# crate itself ships no runtime locking.
fd-lock = "4"

[lints]
workspace = true
