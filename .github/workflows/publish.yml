name: Publish to crates.io

# Mirrors Oneiriq/chine's `publish.yml`: it fires on a published GitHub
# Release (or a manual dispatch), re-verifies the tagged commit, then
# publishes to crates.io behind a human-approved environment gate.
#
# crates.io has no staging registry, so:
#   * a prerelease Release, or a `dry-run` dispatch, runs `verify` only
#     (the CI gate plus `cargo publish --workspace --dry-run`, uploads
#     nothing);
#   * a normal Release, or a `crates-io` dispatch, runs verify -> approval
#     (the `crates-io-approval` environment gate) -> publish.
#
# Every workspace member ships, in dependency order, through
# `cargo publish --workspace`. To keep a member off crates.io, set
# `publish = false` in its Cargo.toml instead of listing packages here.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - crates-io

permissions:
  contents: read

# Two publishes of the same crates must never race.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # `cargo pkgid` needs a Cargo.lock, which this repo does not commit,
      # so the version comes from `cargo metadata --no-deps` instead.
      - name: Verify tag matches the sigilbuzz version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sigilbuzz") | .version')"
          echo "Tag version:   $TAG_VERSION"
          echo "Crate version: $CRATE_VERSION"
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the sigilbuzz version $CRATE_VERSION"
            exit 1
          fi

      # The same gate as ci.yml and hooks/pre-push.
      - name: fmt
        run: cargo fmt --all --check

      - name: clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (no default features)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: build (no_std)
        run: cargo build --no-default-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run

      # The rust-cache post step walks target/ after the job and treats the
      # package-verification dir cargo leaves behind as a workspace, so its
      # probes land as failure-level annotations on a succeeding job. The dir
      # has served its purpose by now.
      - name: Drop the package-verification dir
        run: rm -rf target/package

  approval:
    name: Approve crates.io publish
    needs: verify
    # Only the real-publish path: a normal Release, or an explicit `crates-io`
    # dispatch. A prerelease Release or a `dry-run` dispatch stops after verify.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'crates-io') ||
      (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    # `crates-io-approval` is a GitHub Environment; add required reviewers in
    # the repo settings to make this job wait on human sign-off before publish.
    environment:
      name: crates-io-approval
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: echo "Awaiting approval to publish to crates.io..."

  publish:
    name: Publish to crates.io
    needs: approval
    runs-on: ubuntu-latest
    # A first release waits out the crates.io new-crate limit (see below).
    timeout-minutes: 180
    environment:
      name: crates-io
      url: https://crates.io/crates/sigilbuzz
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # crates.io lets an account publish five new crates in a burst, then
      # one every ten minutes. New versions of existing crates have a much
      # higher limit. A release that creates more than five crates therefore
      # stops with HTTP 429 partway, and a plain rerun of
      # `cargo publish --workspace` fails on the first crate that is already
      # up. So each attempt excludes the members whose version is already in
      # the crates.io index, and a 429 waits out the limit and retries.
      #
      # cargo also waits, after each upload, for the new versions to show up
      # in the index before it publishes the crates that depend on them. When
      # the index lags, it gives up with "unable to publish ... due to a
      # timeout while waiting for published dependencies to be available"
      # (0.23.0 hit this). That, and a crate that is already up although the
      # index check above missed it, only need the index to catch up, so
      # they retry after a short wait. cargo's own check reports such a crate
      # as "already exists", and the crates.io server, which answers when
      # cargo's check misses it too, as "crate version `X` is already
      # uploaded" (HTTP 400). Re-running a failed publish job resumes the
      # same way.
      #
      # cargo reads the token from the environment, which keeps it off the
      # command line.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          # The members cargo would publish, as "name version" lines.
          members() {
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"'
          }

          # Succeeds when the crates.io sparse index lists version $2 of crate $1.
          on_crates_io() {
            local name=$1 version=$2 path
            case ${#name} in
              1) path="1/$name" ;;
              2) path="2/$name" ;;
              3) path="3/${name:0:1}/$name" ;;
              *) path="${name:0:2}/${name:2:2}/$name" ;;
            esac
            curl -fsS "https://index.crates.io/$path" 2>/dev/null |
              jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null
          }

          # Retries left for each kind of failure, and how long each waits.
          # A rate limit clears one new crate every ten minutes; the index
          # usually catches up within a minute or two.
          rate_limit_retries=12
          rate_limit_wait=660
          index_retries=10
          index_wait=90

          attempt=0
          while true; do
            attempt=$((attempt + 1))
            excludes=()
            pending=0
            while read -r name version; do
              if on_crates_io "$name" "$version"; then
                echo "$name $version is already on crates.io"
                excludes+=(--exclude "$name")
              else
                pending=$((pending + 1))
              fi
            done < <(members)

            if [ "$pending" -eq 0 ]; then
              echo "Every crate is on crates.io."
              exit 0
            fi

            # The log lives outside the checkout: a file in the repo makes
            # the working tree dirty, and cargo publish refuses to package it.
            log="$RUNNER_TEMP/publish.log"
            if cargo publish --workspace "${excludes[@]}" 2>&1 | tee "$log"; then
              exit 0
            fi

            # Retry only a rate-limit refusal, or a failure that waits on the
            # index: a crate that is up but not yet visible in it, or cargo
            # timing out while it waits for a dependency it just published.
            # Anything else is a real failure. A 429 takes the long wait even
            # when the log has both.
            if grep -qE 'status 429' "$log"; then
              if [ "$rate_limit_retries" -eq 0 ]; then
                echo "::error::crates.io still rate limits the publish after attempt $attempt"
                exit 1
              fi
              rate_limit_retries=$((rate_limit_retries - 1))
              echo "::notice::crates.io rate limit reached on attempt $attempt; retrying in $((rate_limit_wait / 60)) minutes"
              sleep "$rate_limit_wait"
            elif grep -qE 'already exists|is already uploaded|due to a timeout while waiting for published dependencies' "$log"; then
              if [ "$index_retries" -eq 0 ]; then
                echo "::error::The crates.io index still lags after attempt $attempt"
                exit 1
              fi
              index_retries=$((index_retries - 1))
              echo "::notice::Waiting for the crates.io index on attempt $attempt; retrying in $index_wait seconds"
              sleep "$index_wait"
            else
              exit 1
            fi
          done

      - name: Drop the package-verification dir
        run: rm -rf target/package
