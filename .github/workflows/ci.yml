name: CI

# Runs on pushes to main and any release branch, and on every pull request
# targeting those. The pre-push hook (hooks/pre-push) runs the same steps
# locally. Clippy and the tests cover the whole workspace.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: CI
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-sigilbuzz"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (no default features)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: build (no_std)
        run: cargo build --no-default-features
