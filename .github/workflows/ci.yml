name: CI

# Runs on pushes to main and any release branch, and on every pull request
# targeting those. The pre-push hook (hooks/pre-push) runs the same steps
# locally. Clippy and the tests cover the whole workspace.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: CI
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-sigilbuzz"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (no default features)
        run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: build (no_std)
        run: cargo build --no-default-features

  msrv:
    name: MSRV (Rust 1.81)
    runs-on: [self-hosted, aur0]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust 1.81
        uses: dtolnay/rust-toolchain@1.120

      # Newer releases of some dependencies (clap, for one) need a newer Rust.
      # Resolve the versions that still support 1.81, the way a 1.81 user's
      # cargo would.
      - name: Resolve 1.81-compatible dependencies
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile

      - name: check libraries without default features (no_std)
        run: cargo +1.81 check --workspace --lib --no-default-features

      - name: check libraries and binaries
        run: cargo +1.81 check --workspace --lib --bins --all-features
