version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Anchorage"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: cargo
    # The fuzz targets are their own workspace, so list them separately.
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Anchorage"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
