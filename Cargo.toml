[workspace]
# The shaping core lives at the repo root. Companion crates (GPU
# encoding, COLRv1 paint, rasterizing, subsetting, WOFF, PDF, SVG, and
# so on) live under `crates/` and depend on the core. They work under
# different constraints. GPU float math and matrix composition don't
# belong in the no_std shaper.
members = [".", "crates/*"]
# The cargo-fuzz targets are their own workspace and need nightly.
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
rust-version = "1.81"
authors = ["Shon Thomas <shonpt@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/Oneiriq/sigilbuzz"

[workspace.dependencies]
# Shared version pin. Companion crates use `sigilbuzz = { workspace = true }`
# to pick up the shaper.
sigilbuzz = { path = ".", version = "0.23.1" }

[package]
name = "sigilbuzz"
version = "0.23.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust, clean-room text shaping engine with a HarfBuzz-style API. No runtime dependencies, works in no_std."
publish = true
readme = "README.md"
keywords = ["text", "shaping", "opentype", "harfbuzz", "typography"]
categories = ["text-processing", "rendering", "no-std"]
# Brand assets and repo tooling (CI, git hooks, contributor rules) stay out
# of the published package.
exclude = ["/assets", "/.github", "/hooks", "/scripts", "/agent.md"]

[lib]
# Standalone library. No proc-macros, no C glue.

[features]
# Everything is pure Rust by default. The crate always links `alloc`
# (Vec and String are part of the shaping API), so there is no `alloc`
# feature to toggle. `std` only adds filesystem helpers such as
# `Blob::from_path`. Turn it off for embedded and no_std targets; the
# shaping path does not need it.
default = ["std"]
std = []

[dependencies]
# Empty on purpose. Every byte of parsing and shaping is sigilbuzz
# code. Any new dependency needs an entry in docs/deps.md explaining
# what it buys us and why it can't be written in-house.

[dev-dependencies]
# Tests may depend on sample fonts and timing utilities. Add them here,
# never in [dependencies].
# rustybuzz is the reference the parity tests compare shaping output
# against. Dev-dep only: the core crate must never link against it.
rustybuzz = "0.20"
# ttf-parser drives the outline-parity tests: we compare our
# glyph_outline stream against its OutlineBuilder callbacks across
# every glyph of the bundled fonts. Never linked by sigilbuzz proper.
ttf-parser = "0.25"
# Criterion drives the shaping benches under benches/. Dev-dep only:
# benches do not ship in any release artifact and never enter the
# crate's dependency closure.
criterion = "0.8"

[[bench]]
name = "shape_latin"
harness = false

[[bench]]
name = "shape_arabic"
harness = false

[[bench]]
name = "shape_devanagari"
harness = false

[[bench]]
name = "shape_khmer"
harness = false

[[bench]]
name = "shape_hebrew"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true

# Workspace-wide lints. Every crate opts in with `[lints] workspace =
# true` to enforce the rules in `docs/STABILITY.md`:
#
#   missing_docs = warn: every `pub` item must carry a doc comment so
#                        the public API documents itself.
#   unsafe_op_in_unsafe_fn = warn: surface every unsafe operation, even
#                        inside an `unsafe fn` body.
#
# Per-crate `[lints]` blocks may add stricter rules. Today every crate
# uses the workspace baseline, including clippy::all and pedantic with
# the selective allows below.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

# Workspace-wide clippy enforcement. Hoisted from the root crate in
# 0.20.0 after the companion-crate pedantic cleanup. Hoisting it earlier
# surfaced about 100 existing violations across the 11 companion crates.
# Those are now fixed or narrowly allowed (see the commit history on
# chore/companion-pedantic-cleanup).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Selectively relaxed. These fire on patterns that are idiomatic in a
# low-level parser and would otherwise add noise.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"       # `b'A' as u16` in test fixtures is clearer than `u16::from(b'A')`
cast_sign_loss = "allow"      # `i16 as u16` for OpenType delta arithmetic is intended
# `cast_possible_wrap` rounds out the cast family for binary parsers:
# OpenType offsets are stored as `usize` in our parsers but written
# back as `i32`/`i16` in encoded tables. The wrap is intentional and
# bounded by the format spec, not a correctness concern.
cast_possible_wrap = "allow"
# doc_markdown fires constantly on CamelCase OpenType names like
# ScriptList / FeatureList / ValueRecord / GSUB that are plain English
# prose references, not Rust identifiers. Relaxing it lets the docs
# read like the OpenType spec they describe.
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `missing_docs_in_private_items` is noisy and not relevant to the
# stability commitment. It would fire on every `fn helper()` in a
# private module. We rely on `missing_docs` (rustc) to enforce the
# public-API-doc rule and let private items document themselves on a
# best-effort basis.
missing_docs_in_private_items = "allow"
# Rust 1.99 added `assert_is_empty` to the style group. It fires on every
# `assert!(x.is_empty())` (71 sites, almost all in tests), and its
# rewrites need a typed empty value at each one, such as
# `assert_eq!(breaks, [] as [usize; 0])`, which reads worse than the
# assertion it replaces.
assert_is_empty = "allow"
# Companion-crate pedantic exemptions. These fire across the binary
# encoder/decoder code in sigilbuzz-subset, sigilbuzz-woff,
# sigilbuzz-gpu, sigilbuzz-pdf and the parser code in
# sigilbuzz-text-layout. Each is idiomatic for the work done at
# that layer, not a correctness concern.
#
# `similar_names`: parser locals like `idx`/`index`, `glyph`/`glyph_id`,
# `coord`/`coords` collide constantly. Fighting clippy here just makes
# the parser harder to read.
similar_names = "allow"
# `items_after_statements`: encoder code groups inline `const` byte
# tables and helper structs next to their first use site for locality.
items_after_statements = "allow"
# `bool_to_int_with_if`: byte-level encoding (`if flag { 1 } else { 0 }`
# packed into a header byte) reads more clearly as an `if` than
# `u8::from(flag)`.
bool_to_int_with_if = "allow"
# `match_bool` / `single_match_else`: explicit match-on-bool/Option
# patterns appear in encoder code where future variants are expected
# (for example WOFF2 transform variants).
match_bool = "allow"
single_match_else = "allow"
# `float_cmp`: COLRv1 / variation-store code compares `f32` axis
# coordinates and gradient stops bit-exactly against canonical values
# (0.0, 1.0, default). Tolerance comparisons would be wrong here.
float_cmp = "allow"
# `too_many_lines`: parsers for CFF/CFF2 INDEX/Top DICT, WOFF2 transform
# tables, and gvar variation stores are long state machines by nature.
# Splitting them obscures the mapping to the spec.
too_many_lines = "allow"
# `struct_field_names`: for example the `glyf_slot` / `loca_slot` /
# `cff_slot` pattern in subset table allocation. The suffix carries
# meaning, not redundancy.
struct_field_names = "allow"
# `unnecessary_wraps`: many parser entry points return `Result` even
# when the current implementation cannot fail, because the format
# permits future error paths and external callers code against the
# fallible signature.
unnecessary_wraps = "allow"
# `trivially_copy_pass_by_ref`: a handful of helper signatures take
# `&Tag` / `&u32` for symmetry with neighboring fns that take a
# real reference. Enforcing by-value here would make the signatures
# inconsistent across each module.
trivially_copy_pass_by_ref = "allow"
# `redundant_closure_for_method_calls`: `.map(|b| b.to_vec())` is
# clearer than the `<[u8]>::to_vec` method-pointer suggestion in the
# subset crate.
redundant_closure_for_method_calls = "allow"
# `single_match`: tolerated in parser dispatch tables where future
# arms are documented in the spec but not yet implemented.
single_match = "allow"
# `manual_let_else`: a couple of pre-1.65-style `match` blocks remain
# in subset/woff parsers where the early-return shape is more readable
# than the `let ... else` form.
manual_let_else = "allow"
# `unreadable_literal`: hex constants for OT tags / WOFF2 magic bytes
# are intentionally unseparated.
unreadable_literal = "allow"
# `map_unwrap_or`: `.map(f).unwrap_or(default)` is more readable than
# `.map_or(default, f)` when the closure or default is non-trivial,
# which is the common case in subset/pdf parsers.
map_unwrap_or = "allow"
# `struct_excessive_bools`: subset options structs (SubsetInput etc.)
# are flag bags by design. Turning them into bitflags would change
# the public API for no readability gain.
struct_excessive_bools = "allow"
# `many_single_char_names`: 2D affine transform code uses the
# standard CSS / PostScript `a, b, c, d, e, f` matrix naming. The
# single-letter names are the spec.
many_single_char_names = "allow"
# `match_same_arms`: parser dispatch tables sometimes have identical
# bodies for distinct arms because the spec gives each tag its own
# meaning. Collapsing them would lose the explicit arm list, which
# doubles as documentation.
match_same_arms = "allow"
# `explicit_iter_loop`: `BTreeMap::iter_mut()` cannot be replaced
# with `&mut *m` because BTreeMap doesn't implement DerefMut. The
# explicit form is required, not stylistic.
explicit_iter_loop = "allow"
# `needless_continue`: render/src/svg.rs keeps an explicit `continue`
# in each tag-kind dispatch arm so the arms stay symmetric.
needless_continue = "allow"
# `uninlined_format_args`: fires in test fixtures where `format!("{}", x)`
# patterns predate the captured-identifier syntax. Purely stylistic, and
# not worth a churn PR.
uninlined_format_args = "allow"
# `needless_pass_by_value`: clap-derived cli `Args` structs are
# consumed by their `run(args)` entry points by convention. Taking
# them by value matches the standard `clap` example and lets
# subcommands move owned `PathBuf`s without an extra `.clone()`.
needless_pass_by_value = "allow"
# `borrow_as_ptr`: `&x as *const T` and `addr_of!(x)` are equivalent
# but the former is more idiomatic in the FFI-heavy capi crate.
borrow_as_ptr = "allow"
# `checked_conversions`: `x <= u16::MAX as u32` reads more clearly as
# a numeric comparison than `u16::try_from(x).is_ok()` in some hot
# paths. We accept both forms.
checked_conversions = "allow"
# `needless_raw_string_hashes`: SVG/XML fixtures use `r##"..."##`
# uniformly so authors can paste in attribute strings containing `"`
# without re-counting hashes. Letting clippy strip hashes per fixture
# would create a maintenance trap.
needless_raw_string_hashes = "allow"

# The root crate inherits the workspace lint baseline with no additions.
[lints]
workspace = true
